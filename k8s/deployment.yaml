apiVersion: apps/v1
kind: Deployment
metadata:
  name: xai-service
  labels:
    app: xai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xai-service
  template:
    metadata:
      labels:
        app: xai-service
    spec:
      containers:
        - name: xai-service
          image: xai-cloud-service:latest
          # Use image from local Docker daemon (Minikube must load it)
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
