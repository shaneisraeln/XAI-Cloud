apiVersion: v1
kind: Service
metadata:
  name: xai-service
  labels:
    app: xai-service
spec:
  type: NodePort
  selector:
    app: xai-service
  ports:
    - name: http
      protocol: TCP
      port: 8000        # port inside the cluster
      targetPort: 8000  # port inside the container
      nodePort: 30800   # port exposed on the Minikube node (access via minikube ip)
